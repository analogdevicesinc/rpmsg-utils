name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build
        run: make

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: rpmsg-utils
          if-no-files-found: error
          path: |
            rpmsg-xmit
            rpmsg-xmit-p
            rpmsg-bind-chardev
            rpmsg-xmit-p-usr_data
